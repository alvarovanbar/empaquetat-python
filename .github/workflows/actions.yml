name: Copile

on:
  push:
    brach: [main]

jobs:
  compile-linux:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout del repo
         uses: actions/checkout@v4

       - name: Configurem python
         uses: actions/checkout@v7
         with:
            python-version: '3.13'

       - name: Instalem paquets
         run: pip install pyinstaller

       - name: Empaquetem
         run: pyinstaller --onefile comprova_desplegaments.py

